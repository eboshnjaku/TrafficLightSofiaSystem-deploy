# MQTT broker for the laptop release (Wi-Fi mode). Started HIDDEN by Start-TrafficLight.bat.
# LAB ONLY: anonymous access on the local network so the ESP-01 can connect. Do not expose port
# 1883 to the internet.

listener 1883 0.0.0.0
allow_anonymous true

# Nothing to keep between runs.
persistence false

# Log to stdout. Start-TrafficLight.bat runs the broker in a HIDDEN window, so it can't be paused by a click.
# (Not to a file: Mosquitto 2.1 on Windows creates log files with broken permissions - unreadable,
#  undeletable, and it may then fail to reopen them on the next start.)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %H:%M:%S
